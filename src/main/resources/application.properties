# Application Configuration
spring.application.name=GudangKu
spring.profiles.default=dev

# Production-safe database defaults. The dev profile supplies local Laragon defaults.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gudang_akhir}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=Asia/Jakarta
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Existing databases are adopted at v15; new databases start from the v15 baseline.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=15
spring.flyway.locations=classpath:db/migration

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Shared outbound lot allocation strategy for stock issues, DO reservations, MRO, and STO.
# FIFO, FEFO, or LEFO; FEFO is the default.
gudangku.inventory.picking-strategy=${PICKING_STRATEGY:FEFO}
gudangku.inventory.demand-history-months=${DEMAND_HISTORY_MONTHS:3}

# Set to false only when inbound quality checks are handled outside GudangKu.
gudangku.inbound.qc-required=${QC_REQUIRED:true}
# When enabled, pending inbound QC appears oldest-first ahead of other receipts.
gudangku.inbound.qc-fifo=${QC_INBOUND_FIFO:false}

# Logging
logging.level.org.springframework=INFO
logging.level.com.mycompany.tugas_akhir=INFO
