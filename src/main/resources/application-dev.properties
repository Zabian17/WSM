# Local Laragon defaults. Production should activate a profile other than dev.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gudang_akhir}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:DISABLED}&serverTimezone=Asia/Jakarta
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
