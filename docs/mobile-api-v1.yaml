openapi: 3.1.0
info:
  title: GudangKu Mobile API
  version: 1.0.0
  description: Authenticated mobile execution API for stock counts, inbound putaway, DO picking, and MRO.
servers:
  - url: http://127.0.0.1:8765/api/mobile/v1
    description: Local-only default. Use HTTPS when binding to a warehouse network address.
security:
  - bearerAuth: []
paths:
  /auth/sessions:
    post:
      security: []
      summary: Create an 8-hour mobile API session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 150 }
                password: { type: string, format: password, maxLength: 72 }
      responses:
        '201':
          description: Session created. Store the access token in the platform's secure credential store.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresAt, user]
                properties:
                  accessToken: { type: string }
                  tokenType: { const: Bearer }
                  expiresAt: { type: string, format: date-time }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      fullName: { type: string }
                      role: { type: string }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/sessions/current:
    delete:
      summary: Revoke the current session
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /stock-counts:
    get:
      summary: List scheduled or open counts available to the signed-in user
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated stock count summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCountPage'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /stock-counts/{countId}/start:
    post:
      summary: Start a scheduled count and take its stock snapshot
      parameters:
        - { $ref: '#/components/parameters/countId' }
      responses:
        '200':
          description: Count started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCount' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /stock-counts/{countId}/lines:
    get:
      summary: List open count lines assigned to or available for the signed-in user
      description: Expected quantities and previous counted quantities are intentionally omitted for blind counts.
      parameters:
        - { $ref: '#/components/parameters/countId' }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        '200':
          description: Paginated open SKU lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountLinePage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Submit a batch of physical quantities
      description: Batches may be submitted incrementally. A WMS1 item QR may be supplied to validate SKU identity; omit it for zero-stock/manual entries.
      parameters:
        - { $ref: '#/components/parameters/countId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counts]
              properties:
                counts:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [lineId, quantity]
                    properties:
                      lineId: { type: integer }
                      quantity: { type: integer, minimum: 0 }
                      barcodePayload: { type: string, maxLength: 512, description: WMS1 item QR payload }
      responses:
        '200':
          description: Batch saved; status changes to COUNTED when all session lines are complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [COUNTING, COUNTED] }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /putaway/receipts:
    get:
      summary: List inbound receipts waiting for putaway
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated pending putaway tasks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PutawayTaskPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /putaway/receipts/{receiptId}/suggestions:
    get:
      summary: List compatible destination rack suggestions
      parameters:
        - { $ref: '#/components/parameters/receiptId' }
      responses:
        '200':
          description: Rack suggestions ordered by existing putaway policy
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RackSuggestion' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /putaway/receipts/{receiptId}/complete:
    post:
      summary: Complete putaway after scanning item and destination barcodes
      parameters:
        - { $ref: '#/components/parameters/receiptId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemBarcode, locationBarcode, rackId]
              properties:
                itemBarcode: { type: string, maxLength: 512, description: WMS1 item QR payload }
                locationBarcode: { type: string, maxLength: 512, description: SLOC1 rack QR payload }
                rackId: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Putaway posted to inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: PUTAWAY }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /picking/tasks:
    get:
      summary: List in-progress picking tasks assigned to the signed-in picker
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated tasks assigned to the current picker
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickTaskPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /picking/tasks/{taskId}:
    get:
      summary: Read section-scoped lot, location, and quantity instructions
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      responses:
        '200':
          description: Task details with unpicked lot allocations in the assigned section
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickTaskDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /picking/tasks/{taskId}/scans:
    post:
      summary: Record a pick after scanning item and SLOC barcodes
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lineId, quantity, itemBarcode, locationBarcode]
              properties:
                lineId: { type: integer, minimum: 1 }
                quantity: { type: integer, minimum: 1 }
                itemBarcode: { type: string, maxLength: 512, description: WMS1 item QR payload }
                locationBarcode: { type: string, maxLength: 512, description: SLOC1 rack QR payload }
      responses:
        '200':
          description: Scan recorded against its order, lot reservation, and assigned section
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /picking/tasks/{taskId}/complete:
    post:
      summary: Complete the picking order; release unpicked reserved quantities
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      responses:
        '200':
          description: Picking completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: PICKED }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mro/tasks:
    get:
      summary: List MRO pick tasks assigned to the signed-in picker
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Assigned MRO pick tasks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MroTaskPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mro/tasks/{taskId}:
    get:
      summary: Read remaining quantities for an assigned MRO pick task
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      responses:
        '200':
          description: MRO request lines and issued quantities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MroTaskDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mro/tasks/{taskId}/scans:
    post:
      summary: Issue reserved MRO stock after scanning item and location barcodes
      parameters:
        - { $ref: '#/components/parameters/taskId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, itemBarcode, locationBarcode]
              properties:
                quantity: { type: integer, minimum: 1 }
                itemBarcode: { type: string, maxLength: 512, description: WMS1 item QR payload }
                locationBarcode: { type: string, maxLength: 512, description: SLOC1 rack QR payload }
      responses:
        '200':
          description: Goods Issue recorded; the task closes when all requested units are issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /returns:
    get:
      summary: List approved returns available for warehouse posting
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Approved return requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /returns/{requestId}:
    get:
      summary: Read lines for an approved return
      parameters:
        - { $ref: '#/components/parameters/requestId' }
      responses:
        '200':
          description: Return request and scan requirements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /returns/{requestId}/post:
    post:
      summary: Verify each return line by item and rack scan, then post stock ledger entries
      parameters:
        - { $ref: '#/components/parameters/requestId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scans]
              properties:
                scans:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [lineId, itemBarcode, locationBarcode]
                    properties:
                      lineId: { type: integer, minimum: 1 }
                      itemBarcode: { type: string, maxLength: 512, description: WMS1 item QR payload }
                      locationBarcode: { type: string, maxLength: 512, description: SLOC1 rack QR payload }
      responses:
        '200':
          description: Return posted after every line scan matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: POSTED }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    countId:
      name: countId
      in: path
      required: true
      schema: { type: integer }
    receiptId:
      name: receiptId
      in: path
      required: true
      schema: { type: integer }
    taskId:
      name: taskId
      in: path
      required: true
      schema: { type: integer }
    requestId:
      name: requestId
      in: path
      required: true
      schema: { type: integer }
  schemas:
    StockCount:
      type: object
      properties:
        id: { type: integer }
        countCode: { type: string }
        cycleCode: { type: [string, 'null'] }
        cycleType: { type: string, enum: [AD_HOC, DAILY, MONTHLY, PERIODIC] }
        rackCode: { type: string }
        status: { type: string, enum: [SCHEDULED, COUNTING] }
        dueDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
    CountLine:
      type: object
      properties:
        id: { type: integer }
        itemCode: { type: string }
        itemName: { type: string }
        unit: { type: [string, 'null'] }
        assignedTo: { type: [string, 'null'] }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    StockCountPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StockCount' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    CountLinePage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CountLine' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PutawayTask:
      type: object
      properties:
        id: { type: integer }
        receiptCode: { type: string }
        itemCode: { type: string }
        itemName: { type: string }
        quantity: { type: integer }
        batchCode: { type: string }
        expiryDate: { type: [string, 'null'], format: date }
        status: { type: string, const: PUTAWAY_PENDING }
        createdAt: { type: string, format: date-time }
    RackSuggestion:
      type: object
      properties:
        rackId: { type: integer }
        rackCode: { type: string }
        availableCapacity: { type: integer }
        categoryMatch: { type: boolean }
        storageTypeMatch: { type: boolean }
        availableCbm: { type: [number, 'null'] }
    PutawayTaskPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PutawayTask' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    PickTask:
      type: object
      properties:
        taskId: { type: integer }
        taskCode: { type: string }
        orderId: { type: integer }
        orderCode: { type: string }
        sectionCode: { type: string }
        status: { type: string, const: IN_PROGRESS }
        createdAt: { type: string, format: date-time }
    PickInstruction:
      type: object
      properties:
        lineId: { type: integer }
        itemCode: { type: string }
        itemName: { type: string }
        unit: { type: [string, 'null'] }
        rackCode: { type: string }
        batchCode: { type: string }
        expiryDate: { type: [string, 'null'], format: date }
        reservedQuantity: { type: integer }
        pickedQuantity: { type: integer }
        remainingQuantity: { type: integer }
    PickTaskDetail:
      type: object
      properties:
        task: { $ref: '#/components/schemas/PickTask' }
        lines: { type: array, items: { $ref: '#/components/schemas/PickInstruction' } }
    PickTaskPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PickTask' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    MroTask:
      type: object
      properties:
        taskId: { type: integer }
        taskCode: { type: string }
        requestId: { type: integer }
        requestCode: { type: string }
        reason: { type: string }
        taskStatus: { type: string, enum: [ASSIGNED, IN_PROGRESS] }
        requestStatus: { type: string, enum: [APPROVED, PARTIALLY_ISSUED] }
        createdAt: { type: string, format: date-time }
    MroInstruction:
      type: object
      properties:
        lineId: { type: integer }
        itemCode: { type: string }
        itemName: { type: string }
        unit: { type: [string, 'null'] }
        requestedQuantity: { type: integer }
        issuedQuantity: { type: integer }
        remainingQuantity: { type: integer }
    MroTaskDetail:
      type: object
      properties:
        task: { $ref: '#/components/schemas/MroTask' }
        lines: { type: array, items: { $ref: '#/components/schemas/MroInstruction' } }
    MroTaskPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/MroTask' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    ReturnRequest:
      type: object
      properties:
        id: { type: integer }
        returnCode: { type: string }
        returnType: { type: string, enum: [PURCHASE, SALES] }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        lineCount: { type: integer }
    ReturnLine:
      type: object
      properties:
        lineId: { type: integer }
        itemCode: { type: string }
        itemName: { type: string }
        quantity: { type: integer }
        batchCode: { type: string }
        expiryDate: { type: [string, 'null'], format: date }
        rackCode: { type: string }
    ReturnDetail:
      type: object
      properties:
        request: { $ref: '#/components/schemas/ReturnRequest' }
        lines: { type: array, items: { $ref: '#/components/schemas/ReturnLine' } }
    ReturnPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ReturnRequest' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InvalidCredentials:
      description: Email or password is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Too many login attempts
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Requested resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Count is in a state that cannot accept this operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
