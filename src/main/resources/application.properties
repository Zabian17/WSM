# Application Configuration
spring.application.name=GudangKu

# Database Configuration (MySQL Laragon: root / no password / db: gudang_akhir)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gudang_akhir}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Shared outbound lot allocation strategy for stock issues, DO reservations, MRO, and STO.
# FIFO, FEFO, or LEFO; FEFO is the default.
gudangku.inventory.picking-strategy=${PICKING_STRATEGY:FEFO}

# Set to false only when inbound quality checks are handled outside GudangKu.
gudangku.inbound.qc-required=${QC_REQUIRED:true}

# Logging
logging.level.org.springframework=INFO
logging.level.com.mycompany.tugas_akhir=INFO
