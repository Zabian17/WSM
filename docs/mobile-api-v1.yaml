openapi: 3.1.0
info:
  title: GudangKu Mobile API
  version: 1.0.0
  description: Authenticated mobile execution API for stock cycle counts.
servers:
  - url: http://127.0.0.1:8765/api/mobile/v1
    description: Local-only default. Use HTTPS when binding to a warehouse network address.
security:
  - bearerAuth: []
paths:
  /auth/sessions:
    post:
      security: []
      summary: Create an 8-hour mobile API session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 150 }
                password: { type: string, format: password, maxLength: 72 }
      responses:
        '201':
          description: Session created. Store the access token in the platform's secure credential store.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresAt, user]
                properties:
                  accessToken: { type: string }
                  tokenType: { const: Bearer }
                  expiresAt: { type: string, format: date-time }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      fullName: { type: string }
                      role: { type: string }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/sessions/current:
    delete:
      summary: Revoke the current session
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /stock-counts:
    get:
      summary: List scheduled or open counts available to the signed-in user
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated stock count summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockCountPage'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /stock-counts/{countId}/start:
    post:
      summary: Start a scheduled count and take its stock snapshot
      parameters:
        - { $ref: '#/components/parameters/countId' }
      responses:
        '200':
          description: Count started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockCount' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /stock-counts/{countId}/lines:
    get:
      summary: List open count lines assigned to or available for the signed-in user
      description: Expected quantities and previous counted quantities are intentionally omitted for blind counts.
      parameters:
        - { $ref: '#/components/parameters/countId' }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        '200':
          description: Paginated open SKU lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountLinePage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Submit a batch of physical quantities
      description: Batches may be submitted incrementally. A WMS1 item QR may be supplied to validate SKU identity; omit it for zero-stock/manual entries.
      parameters:
        - { $ref: '#/components/parameters/countId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counts]
              properties:
                counts:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [lineId, quantity]
                    properties:
                      lineId: { type: integer }
                      quantity: { type: integer, minimum: 0 }
                      barcodePayload: { type: string, maxLength: 512, description: WMS1 item QR payload }
      responses:
        '200':
          description: Batch saved; status changes to COUNTED when all session lines are complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [COUNTING, COUNTED] }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    countId:
      name: countId
      in: path
      required: true
      schema: { type: integer }
  schemas:
    StockCount:
      type: object
      properties:
        id: { type: integer }
        countCode: { type: string }
        cycleCode: { type: [string, 'null'] }
        cycleType: { type: string, enum: [AD_HOC, DAILY, MONTHLY, PERIODIC] }
        rackCode: { type: string }
        status: { type: string, enum: [SCHEDULED, COUNTING] }
        dueDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
    CountLine:
      type: object
      properties:
        id: { type: integer }
        itemCode: { type: string }
        itemName: { type: string }
        unit: { type: [string, 'null'] }
        assignedTo: { type: [string, 'null'] }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    StockCountPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/StockCount' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    CountLinePage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CountLine' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InvalidCredentials:
      description: Email or password is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Too many login attempts
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Stock count does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Count is in a state that cannot accept this operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
